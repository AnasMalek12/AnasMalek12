name: Generate Snake Animation

on:
  # This runs the job every day at midnight
  schedule:
    - cron: "0 0 * * *"

  # This allows you to run the job manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - uses: Platane/snk@v2
        with:
          # Your GitHub username is automatically used by this variable
          github_user_name: ${{ github.repository_owner }}

          # These are the files that will be generated
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v2.1.3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
